spark.master                           yarn
spark.submit.deployMode                cluster
spark.driver.memory                    1g
spark.executor.instances               2
spark.executor.memory                  1g
spark.executor.cores                   1
spark.sql.catalogImplementation        hive
spark.hadoop.hive.metastore.uris       thrift://hive-metastore:9083
spark.sql.hive.metastore.version       3.1.3
# 将镜像中的 Hive 依赖随应用分发给远程 driver。Localize Hive libraries for the YARN driver.
spark.yarn.dist.archives               file:///opt/spark/hive-client.tar.gz#hive-client
spark.sql.hive.metastore.jars          ./hive-client/*
spark.sql.session.timeZone             Asia/Shanghai
